<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/svg+xml">
    <title>Creative branding agency for startups ✪ Outcrowd ✪ Creative branding, web design & development agency</title>
</head>

<body>
    <nav>
        <ul>
            <li><a href="#"><img src="assests/favicon.svg" alt=""></a></li>
            <div class="links">
                <li><a href="#">Cases</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">About us</a></li>
            </div>
            <li class="Book_A_call"><a href="#">Book a Call</a></li>
            <li class="contact"><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="hero_box">
        <div class="hero">
            <h3>Digital brand design agency</h3>
        </div>
        <div class="hero_txt">Design & Brand Acceleration for SaaS Startups</div>
    </div>

    <div class="wave_circle">
        <img src="assests/wave.svg" alt="Wave" width="40">
    </div>

    <div class="building_box">
        <div class="bubble_chat"><img src="assests/chat.png" alt="">
            <li>346+</li>
        </div>
        <div class="box_edge"></div>
        <div class="rocket"><img src="assests/rocket.png" alt=""></div>
        <div class="slider">
            <div class="track">
                <img src="assests/building.png" alt="">
                <img src="assests/building.png" alt="">
            </div>
        </div>
        <div class="box_edge"></div>
    </div>

    <div class="turned_arrow"><img src="assests/turn_arrow.svg" alt=""></div>

    <div class="widget_card">
        <div class="title">Widget control</div>
        <div class="grid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <svg viewBox="0 0 540 280">
            <path class="line" d="M35 185 
           L85 175
           L140 120
           L190 120
           L240 85
           L290 105
           L340 80
           L395 82
           L450 65" />
        </svg>
        <div class="blue-box">
            <p>Result</p>
            <h2>+ 58%</h2>
        </div>
    </div>

    <div class="week_box">
        <div class="box">

            <div class="building b1">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building b2">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building b3">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building b4">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building bc5">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building b6">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

            <div class="building b7">
                <div class="top"></div>
                <div class="bottom"></div>
            </div>

        </div>
    </div>

    <div class="circle">
        <img src="assests/circle.svg" alt="">
    </div>

    <div class="new_freature">
        <img src="assests/new_freature.svg" alt="">
    </div>

    <div class="book">
        <li>Book a call</li> <img src="assests/arrow.svg" alt="">
    </div>


    <div class="video_box">
        <video autoplay muted loop playsinline>
            <source src="assests/showreel-home.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video_space"></div>
    <div class="main">
        <div class="text" id="text"></div>
    </div>

    <div class="cards_box">
        <div class="cards"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
