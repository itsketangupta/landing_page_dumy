<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Video Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 300vh;
            background: #111;
            overflow-x: hidden;
        }

        .box {
            width: 70vw;
            height: 70vh;
            position: fixed;
            top: 95%;
            left: 50%;
            overflow: hidden;
            transform: translate(-50%, -50%) scale(0.8);
            border-radius: 35px;
            will-change: transform;
            border: 20px solid rgb(15, 15, 15);
        }

        .box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="box">

        <video autoplay muted loop playsinline>
            <source src="showreel-home.mp4" type="video/mp4">
        </video>

    </div>

    <script src="script.js"></script>

</body>

</html>
